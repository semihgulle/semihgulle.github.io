<style>
:root{
  --ink:#0B1620;
  --ink-2:#132532;
  --paper:#F6F5F2;
  --paper-2:#FFFFFF;
  --text:#17242F;
  --muted:#5C6B77;
  --line:#E2E0DA;
  --cyan:#2FB3BE;
  --deep:#0D6874;
  --coral:#D9613F;
  --serif:"Newsreader",Georgia,serif;
  --sans:"IBM Plex Sans",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.62;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--serif);font-weight:400;letter-spacing:-.015em;margin:0}
a{color:var(--deep);text-decoration:none}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:3px;border-radius:2px}

.layout{display:grid;grid-template-columns:296px 1fr;min-height:100vh}

/* ---------- rail ---------- */
.rail{background:var(--ink);color:#DCE5EA;position:sticky;top:0;height:100vh;
  padding:44px 34px;display:flex;flex-direction:column;overflow:hidden}
.rail::after{content:"";position:absolute;width:340px;height:340px;right:-150px;top:-120px;
  background:radial-gradient(circle,rgba(47,179,190,.30),transparent 65%);pointer-events:none}
.rail .mark{width:34px;height:34px;margin-bottom:26px;opacity:.9}
.rail h1{color:#fff;font-size:31px;line-height:1.12}
.rail .role{font-family:var(--serif);font-style:italic;font-size:16px;color:var(--cyan);margin-top:8px}
.rail .place{font-size:13.5px;color:#8FA2AE;margin-top:16px;line-height:1.55}
.rail nav{margin-top:auto;padding-top:30px;display:flex;flex-direction:column;gap:2px;position:relative;z-index:1}
.rail nav a{color:#C6D3DA;font-size:15px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.07);
  display:flex;justify-content:space-between;align-items:center;transition:color .18s,padding-left .18s}
.rail nav a:hover{color:#fff;padding-left:5px}
.rail nav a.tab{color:#fff;background:rgba(47,179,190,.13);border:1px solid rgba(47,179,190,.35);
  border-radius:3px;padding:9px 12px;margin-top:12px}
.rail nav a.tab:hover{background:rgba(47,179,190,.22);padding-left:12px}
.ids{margin-top:26px;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;position:relative;z-index:1}
.ids a{color:#7E919E}
.ids a:hover{color:var(--cyan)}
.lang{margin-top:20px;font-size:12.5px;color:#7E919E;position:relative;z-index:1}
.lang button{font:inherit;background:none;border:0;padding:0 5px;cursor:pointer;color:#7E919E}
.lang button[aria-pressed=true]{color:#fff;text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--cyan)}

/* ---------- main ---------- */
main{padding:0 0 90px}
.inner{max-width:820px;padding:0 56px}
.hero{padding:84px 0 64px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--coral);font-weight:600}
.hero p.lede{font-family:var(--serif);font-size:clamp(27px,3.4vw,38px);line-height:1.28;margin:18px 0 0;letter-spacing:-.02em}
.hero p.sub{color:var(--muted);margin:22px 0 0;max-width:62ch}

section{padding:46px 0;border-top:1px solid var(--line)}
.stitle{display:flex;align-items:baseline;gap:14px;margin-bottom:30px}
.stitle h2{font-size:13px;font-family:var(--sans);font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.stitle span{flex:1;height:1px;background:var(--line)}

/* cards */
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.card{background:var(--paper-2);border:1px solid var(--line);border-radius:4px;padding:22px 22px 20px;
  position:relative;overflow:hidden;transition:transform .22s ease,box-shadow .22s ease,border-color .22s}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--cyan);
  transform:scaleY(0);transform-origin:top;transition:transform .28s ease}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 28px -18px rgba(11,22,32,.5);border-color:#D2CFC7}
.card:hover::before{transform:scaleY(1)}
.card .no{font-family:var(--serif);font-size:13px;color:var(--coral)}
.card h3{font-size:20px;margin:6px 0 8px;line-height:1.25}
.card p{margin:0;font-size:14.5px;color:var(--muted);line-height:1.55}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chips b{font-weight:400;font-size:12px;color:var(--deep);background:#EAF2F2;border-radius:99px;padding:3px 10px}

/* now list */
.now{display:grid;gap:2px}
.now .row{display:grid;grid-template-columns:112px 1fr;gap:22px;padding:16px 0;border-bottom:1px solid var(--line)}
.now .row:first-child{border-top:1px solid var(--line)}
.now .when{font-size:12.5px;color:var(--muted);letter-spacing:.04em;padding-top:3px}
.now h3{font-size:17.5px;font-family:var(--sans);font-weight:500;letter-spacing:0}
.now p{margin:4px 0 0;font-size:14.5px;color:var(--muted)}

/* pub teaser */
.teaser{background:var(--ink-2);color:#DCE5EA;border-radius:5px;padding:30px 32px;position:relative;overflow:hidden}
.teaser::after{content:"";position:absolute;width:300px;height:300px;right:-120px;bottom:-160px;
  background:radial-gradient(circle,rgba(47,179,190,.25),transparent 65%)}
.teaser .figs{display:flex;gap:34px;flex-wrap:wrap;position:relative;z-index:1}
.teaser .figs div{display:flex;flex-direction:column}
.teaser .n{font-family:var(--serif);font-size:34px;line-height:1;color:#fff}
.teaser .l{font-size:12.5px;color:#8FA2AE;margin-top:5px}
.teaser p{position:relative;z-index:1;margin:20px 0 0;font-size:14.5px;color:#A9BAC4;max-width:56ch}
.btn{position:relative;z-index:1;display:inline-flex;align-items:center;gap:9px;margin-top:22px;
  background:var(--cyan);color:#062229;font-weight:600;font-size:14.5px;padding:11px 20px;border-radius:3px;
  transition:transform .18s,background .18s}
.btn:hover{background:#4CCAD4;transform:translateX(3px)}

.contact p{margin:0 0 6px}
.contact .big{font-family:var(--serif);font-size:24px}
footer{padding:26px 0 0;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);
  display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

.reveal{opacity:0;transform:translateY(14px)}
.reveal.in{opacity:1;transform:none;transition:opacity .55s ease,transform .55s ease}
@media (prefers-reduced-motion:reduce){
  .reveal,.reveal.in{opacity:1;transform:none;transition:none}
  html{scroll-behavior:auto}
  .card:hover,.btn:hover{transform:none}
}
@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  .rail{position:static;height:auto;padding:34px 26px 28px}
  .rail nav{margin-top:26px}
  .rail nav a{border-bottom:0;padding:5px 0}
  .rail nav{flex-direction:row;flex-wrap:wrap;gap:6px 18px;align-items:center}
  .rail nav a.tab{margin-top:0}
  .inner{padding:0 26px}
  .hero{padding:46px 0 34px}
  .cards{grid-template-columns:1fr}
  .now .row{grid-template-columns:1fr;gap:4px}
}
</style>
</head>

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function paint(code){
  const d = T[code];
  document.documentElement.lang = code;
  localStorage.setItem("lang", code);

  $("r-role").textContent = d.role;
  $("r-place").innerHTML = d.place;

  const ids = ["about","areas","now","contact"];
  $("r-nav").innerHTML =
    d.nav.map((t,i)=>`<a href="#${i===0?"top":ids[i]}">${esc(t)}</a>`).join("") +
    `<a class="tab" href="publications.html">${esc(d.tab)} <span aria-hidden="true">→</span></a>`;

  $("r-ids").innerHTML = [
    ["https://orcid.org/"+CONFIG.orcid, d.ids.orcid],
    [CONFIG.scholar, d.ids.scholar],[CONFIG.scopus, d.ids.scopus],[CONFIG.wos, d.ids.wos],
    [CONFIG.researchgate, d.ids.rg],[CONFIG.avesis, d.ids.av],
    ["mailto:"+CONFIG.email, d.ids.mail]
  ].map(([h,t])=>`<a href="${h}"${h.startsWith("http")?' target="_blank" rel="noopener"':''}>${esc(t)}</a>`).join("");

  $("h-eyebrow").textContent = d.eyebrow;
  $("h-lede").textContent = d.lede;
  $("h-sub").textContent = d.sub;
  $("t-areas").textContent = d.t_areas;
  $("t-now").textContent = d.t_now;
  $("t-pubs").textContent = d.t_pubs;
  $("t-contact").textContent = d.t_contact;

  $("c-areas").innerHTML = d.areas.map(([t,p,chips],i)=>
    `<article class="card"><div class="no">${String(i+1).padStart(2,"0")}</div>
     <h3>${esc(t)}</h3><p>${esc(p)}</p>
     <div class="chips">${chips.map(c=>`<b>${esc(c)}</b>`).join("")}</div></article>`).join("");

  $("c-now").innerHTML = d.now.map(([w,t,p])=>
    `<div class="row"><div class="when">${esc(w)}</div>
     <div><h3>${esc(t)}</h3><p>${esc(p)}</p></div></div>`).join("");

  const vals = [CONFIG.metrics.wos, CONFIG.metrics.scopus, CONFIG.metrics.scholar, CONFIG.metrics.h];
  vals.forEach((v,i)=>{ $("m"+(i+1)).textContent = v; $("l"+(i+1)).textContent = d.labels[i]; });
  $("p-teaser").textContent = d.teaser;
  $("p-btn").textContent = d.btn;

  const m = $("mail"); m.href = "mailto:"+CONFIG.email; m.textContent = CONFIG.email;
  $("p-addr").textContent = d.addr;
  $("p-collab").textContent = d.collab;
  $("f-note").textContent = d.note;
  $("f-year").textContent = "© " + new Date().getFullYear() + " Semih Gülle";

  document.querySelectorAll(".lang button").forEach(b=>
    b.setAttribute("aria-pressed", String(b.dataset.lang===code)));
}
document.querySelectorAll(".lang button").forEach(b=>
  b.addEventListener("click", ()=>paint(b.dataset.lang)));

const saved = localStorage.getItem("lang");
paint(saved || ((navigator.language||"").startsWith("tr") ? "tr" : "en"));

const io = new IntersectionObserver(es=>es.forEach(e=>{
  if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); }
}),{rootMargin:"-40px"});
document.querySelectorAll(".reveal").forEach(el=>io.observe(el));
</script>
